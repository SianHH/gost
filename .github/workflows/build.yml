name: Build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  easyfrps:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - uses: actions/setup-go@v4
        with:
          go-version: '1.26'

      - name: Build
        uses: goreleaser/goreleaser-action@v4
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean --timeout 300m --parallelism=4
          workdir: ./gost

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./gost/dist/*.tar.gz
            ./gost/dist/*.zip
          token: ${{ secrets.TOKEN }}
